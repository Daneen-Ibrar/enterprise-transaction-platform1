services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transaction_platform
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d transaction_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_platform
      SPRING_DATASOURCE_USERNAME: platform_user
      SPRING_DATASOURCE_PASSWORD: dev_password
      SPRING_DATA_REDIS_HOST: redis
      # Force proxy headers
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Test users – these MUST exist
      TEST_CUSTOMER_EMAIL: customer@test.com
      TEST_CUSTOMER_PASSWORD: password123
      TEST_MERCHANT_EMAIL: merchant@test.com
      TEST_MERCHANT_PASSWORD: password123
      TEST_ADMIN_EMAIL: admin@test.com
      TEST_ADMIN_PASSWORD: password123
      TEST_AUDITOR_EMAIL: auditor@test.com
      TEST_AUDITOR_PASSWORD: password123
      # Email credentials:
      MAIL_USERNAME: daneen.ibrar@gmail.com
      MAIL_PASSWORD: rrakleuwvhmtanfz
      # Also set app.email.mode if you want:
      APP_EMAIL_MODE: stub