<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>2FA Verification</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        .error { color: red; padding: 10px; border: 1px solid red; background: #ffeeee; margin: 10px 0; }
        label { display: block; margin: 10px 0 5px; }
        input { padding: 5px; width: 200px; }
        button { padding: 5px 15px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .divider { border-top: 1px solid #ddd; margin: 20px 0; }
        .help-text { font-size: 0.8em; color: #888; margin-top: 5px; }
        .backup-code-input { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🔐 Two‑Factor Verification</h1>
    <p>Enter the 6‑digit code from your authenticator app, or use a backup code.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" th:action="@{/2fa/verify}">
        <label>Authenticator Code:</label>
        <input type="text" name="code" maxlength="6" placeholder="6-digit code" />
        <div class="help-text">Enter the code from Google Authenticator, Authy, etc.</div>
        <br/>

        <div class="divider">OR</div>

        <div class="backup-code-input">
            <label>Backup Code:</label>
            <input type="text" name="backupCode" placeholder="e.g., XXXX-XXXX" />
            <div class="help-text">Enter one of your saved backup codes.</div>
        </div>
        <br/>

        <button type="submit">Verify</button>
    </form>

    <div style="margin-top: 20px;">
        <a href="/logout">Cancel</a>
    </div>
</body>
</html>
