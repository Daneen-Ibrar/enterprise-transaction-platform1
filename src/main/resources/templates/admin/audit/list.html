<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audit Event Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .filters input, .filters select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .filters button { padding: 6px 15px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .filters button:hover { background: #1e5c2a; }
        .integrity-badge { padding: 4px 12px; border-radius: 20px; color: white; display: inline-block; }
        .integrity-valid { background: #2d7a3a; }
        .integrity-broken { background: #c0392b; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .pagination { margin-top: 20px; }
        .pagination a { margin-right: 8px; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; background: #3498db; color: white; text-decoration: none; }
        .btn:hover { opacity: 0.8; }
        .hash { font-family: monospace; font-size: 0.8em; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
        .alert { padding: 12px; margin: 10px 0; border-radius: 4px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
    <!-- HTMX from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.10/dist/htmx.min.js"></script>
</head>
<body>
    <h1>🔍 Audit Event Viewer</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <!-- Integrity Status -->
    <div style="margin: 15px 0;">
        <span>Chain Integrity: </span>
        <button hx-get="/admin/audit/verify-fragment"
                hx-target="#verification-result"
                hx-swap="innerHTML"
                class="btn" style="background: #2d7a3a;">
            Verify Chain Integrity
        </button>
        <div id="verification-result"></div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <form method="get" th:action="@{/admin/audit}">
            <label>User ID: <input type="number" name="userId" th:value="${selectedUserId}" /></label>
            <label>Event Type:
                <select name="eventType">
                    <option value="">All</option>
                    <option th:each="type : ${eventTypes}" th:value="${type}" th:text="${type}" th:selected="${type == selectedEventType}"></option>
                </select>
            </label>
            <label>Entity Type: <input type="text" name="entityType" th:value="${selectedEntityType}" placeholder="e.g. Invoice" /></label>
            <label>From: <input type="datetime-local" name="startDate" th:value="${startDate}" /></label>
            <label>To: <input type="datetime-local" name="endDate" th:value="${endDate}" /></label>
            <button type="submit">Apply Filters</button>
            <a th:href="@{/admin/audit}" style="margin-left:10px;">Reset</a>
        </form>
    </div>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Event Type</th>
                <th>User ID</th>
                <th>Entity Type</th>
                <th>Entity ID</th>
                <th>Details</th>
                <th>Created</th>
                <th>Hash Chain</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="event : ${events.content}">
                <td th:text="${event.id}">1</td>
                <td th:text="${event.eventType}">PAYMENT_SETTLED</td>
                <td th:text="${event.userId}">10</td>
                <td th:text="${event.entityType}">Invoice</td>
                <td th:text="${event.entityId}">100</td>
                <td th:text="${event.details}">{"key":"value"}</td>
                <td th:text="${event.createdAt}">2026-01-01</td>
                <td>
                    <span class="hash" th:text="${event.currentHash}">hash</span>
                </td>
                <td>
                    <a th:href="@{/admin/audit/diff/{id}(id=${event.id})}" class="btn">Diff</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
        <span th:if="${events.hasPrevious()}">
            <a th:href="@{/admin/audit(page=${events.number - 1}, userId=${selectedUserId}, eventType=${selectedEventType}, entityType=${selectedEntityType}, startDate=${startDate}, endDate=${endDate})}">Previous</a>
        </span>
        <span>Page [[${events.number + 1}]] of [[${events.totalPages}]]</span>
        <span th:if="${events.hasNext()}">
            <a th:href="@{/admin/audit(page=${events.number + 1}, userId=${selectedUserId}, eventType=${selectedEventType}, entityType=${selectedEntityType}, startDate=${startDate}, endDate=${endDate})}">Next</a>
        </span>
    </div>

</body>
</html>
