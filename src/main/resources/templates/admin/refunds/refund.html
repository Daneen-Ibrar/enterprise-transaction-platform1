<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Refund Transaction</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 8px; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .flash-error { color: red; padding: 10px; border: 1px solid red; background: #ffeeee; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Refund Transaction #<span th:text="${transaction.id}">1</span></h1>
    <a href="/admin/refunds">← Back to list</a>

    <div th:if="${error}" class="flash-error" th:text="${error}">Error</div>

    <form method="post" th:action="@{/admin/refunds/{id}(id=${transaction.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <p><strong>Amount:</strong> <span th:text="${currencyHelper.getFormattedAmount(transaction.amount, transaction.currency)}">£ 100.00</span></p>
        <p><strong>Customer ID:</strong> <span th:text="${transaction.customerId}">1</span></p>
        <p><strong>Merchant ID:</strong> <span th:text="${transaction.merchantId}">2</span></p>

        <label for="reason">Reason for refund:</label>
        <input type="text" id="reason" name="reason" required placeholder="Enter reason..." />

        <button type="submit">Issue Refund</button>
    </form>
</body>
</html>
