<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Feature Toggles</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-toggle { background: #e67e22; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-create { background: #2d7a3a; color: white; padding: 8px 16px; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-enabled { background: #d4edda; color: #155724; }
        .badge-disabled { background: #f8d7da; color: #721c24; }
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .flash-success { background: #d4edda; color: #155724; padding: 10px; border: 1px solid #c3e6cb; margin: 10px 0; }
        .flash-error { background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>⚙️ Feature Toggles</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <div th:if="${success}" class="flash-success" th:text="${success}"></div>
    <div th:if="${error}" class="flash-error" th:text="${error}"></div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="flag : ${flags}">
                <td th:text="${flag.name}">REFUNDS</td>
                <td th:text="${flag.description}">Enable refunds</td>
                <td>
                    <span class="badge" th:classappend="${flag.enabled ? 'badge-enabled' : 'badge-disabled'}"
                          th:text="${flag.enabled ? 'Enabled' : 'Disabled'}">
                    </span>
                </td>
                <td class="actions">
                    <form method="post" th:action="@{/admin/features/{id}/toggle(id=${flag.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-toggle"
                                th:text="${flag.enabled ? 'Disable' : 'Enable'}">
                        </button>
                    </form>
                    <form method="post" th:action="@{/admin/features/{id}/delete(id=${flag.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-delete"
                                onclick="return confirm('Delete this feature flag?')">
                            🗑️
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${flags.empty}">
                <td colspan="4">No feature flags defined.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
