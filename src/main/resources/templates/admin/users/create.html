<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input, select { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .error { color: red; margin: 10px 0; }
        .checkbox-group { max-width: 400px; }
        .checkbox-group label { display: inline-block; margin-right: 15px; }
        .tenant-display { padding: 8px; background: #f0f0f0; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <h1>➕ Create New User</h1>
    <a href="/admin/users">← Back to User List</a>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/users}">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="6" />

   
 <label for="roles">Roles:</label>
<select id="roles" name="roleIds" multiple style="width: 100%; max-width: 400px; padding: 8px; height: 120px;">
    <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}">ROLE</option>
</select>


        <!-- Tenant: dropdown for super admin, read-only for others -->
        <div th:if="${isSuperAdmin}">
            <label for="tenantId">Tenant:</label>
            <select id="tenantId" name="tenantId" required>
                <option th:each="t : ${allTenants}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
        </div>
        <div th:unless="${isSuperAdmin}">
            <label>Tenant:</label>
            <div class="tenant-display" th:text="${currentTenant != null ? currentTenant.name : 'Default'}">Default</div>
        </div>

        <button type="submit">Create User</button>
    </form>
</body>
</html>
