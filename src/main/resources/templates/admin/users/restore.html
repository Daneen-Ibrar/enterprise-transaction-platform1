<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Restore User Access</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn-restore { background: #2d7a3a; color: white; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-restore:hover { background: #1e5c2a; }
        .search-box { margin: 10px 0; }
        .search-box input { padding: 5px; width: 300px; }
        .search-box button { padding: 5px 15px; }
        .btn-clear { padding: 5px 15px; background: #999; color: white; text-decoration: none; border-radius: 4px; }
        .btn-clear:hover { background: #777; }
    </style>
</head>
<body>
    <h1>🔓 Restore User Access</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <div class="search-box">
        <form method="get" th:action="@{/admin/users/restore}">
            <input type="text" name="search" placeholder="Search by email..." th:value="${search}" />
            <button type="submit">Search</button>
            <a th:href="@{/admin/users/restore}" class="btn-clear" th:if="${search != null}">Clear</a>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.email}">user@test.com</td>
                <td th:text="${user.createdAt}">2026-01-01</td>
                <td>
                    <form method="post" th:action="@{/admin/users/{id}/restore(id=${user.id})}">
                        <input type="hidden" name="search" th:value="${search}" />
                        <button type="submit" class="btn-restore">Restore</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="4">No inactive users found.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
