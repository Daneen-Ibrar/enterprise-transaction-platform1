<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Suspicious Invoices</title>
    <style>
        /* ... same styles ... */
    </style>
</head>
<body>
    <h1>🚨 Suspicious Invoices</h1>
    <div th:if="${!suspicionEnabled}" style="background: #f8d7da; color: #721c24; padding: 15px; border: 1px solid #f5c6cb; border-radius: 4px; margin: 10px 0;">
        ⚠️ Suspicion detection is currently <strong>disabled</strong>. Enable it from <a href="/admin/features">Feature Toggles</a> to see suspicious invoices.
    </div>
    <a href="/dashboard">← Back to Dashboard</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Customer</th>
                <th>Risk</th>
                <th>Reason</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inv : ${invoices}"
                th:classappend="${inv.riskLevel == 'RED' ? 'risk-red' : inv.riskLevel == 'YELLOW' ? 'risk-yellow' : 'risk-green'}">
                <td th:text="${inv.id}">1</td>
                <td th:text="${currencyHelper.getFormattedAmount(inv.amount, inv.currency)}">£ 100.00</td>
                <td th:text="${inv.customerEmail}">customer@test.com</td>
                <td th:text="${inv.riskLevel}">RED</td>
                <td th:text="${inv.suspicionReason}">Fraud keyword</td>
                <td class="actions">
                    <!-- Not Fraudulent -->
                    <form method="post" th:action="@{/admin/invoices/{id}/not-fraudulent(id=${inv.id})}" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-not-fraud">✅ Not Fraudulent</button>
                    </form>

                    <!-- Fraudulent -->
                    <form method="post" th:action="@{/admin/invoices/{id}/fraudulent(id=${inv.id})}" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-fraud">🚫 Fraudulent</button>
                    </form>

                    <!-- Chat with Merchant -->
                    <a th:href="@{/private-chat/{id}(id=${inv.id}, withUserId=${inv.merchantId})}" class="btn btn-chat">💬 Merchant</a>

                    <!-- Chat with Customer -->
                    <a th:href="@{/private-chat/{id}(id=${inv.id}, withEmail=${inv.customerEmail})}" class="btn btn-chat">💬 Customer</a>

                    <!-- Revoke Merchant -->
                    <button class="btn btn-revoke" th:data-userid="${inv.merchantId}" onclick="revokeMerchant(this)">Revoke Merchant</button>
                </td>
            </tr>
            <tr th:if="${invoices.empty}">
                <td colspan="6">No suspicious invoices.</td>
            </tr>
        </tbody>
    </table>

    <script>
        function revokeMerchant(button) {
            const userId = button.getAttribute('data-userid');
            if (!confirm('Are you sure you want to revoke access for this merchant?')) return;
            // Get CSRF token from meta tag or hidden field
            const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
            fetch('/admin/users/revoke/' + userId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                }
            })
                .then(response => response.text())
                .then(msg => {
                    alert(msg);
                    location.reload();
                })
                .catch(err => {
                    alert('Error revoking user: ' + err.message);
                });
        }
    </script>
</body>
</html>
