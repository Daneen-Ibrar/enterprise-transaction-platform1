<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Tenant</title>
    <style>
        /* (same styles as before) */
    </style>
</head>
<body>
    <div class="container">
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <h1 th:if="${tenant.id == null}">Create Tenant</h1>
        <h1 th:if="${tenant.id != null}">Edit Tenant</h1>

        <form th:action="${tenant.id == null} ? '/admin/tenants' : '/admin/tenants/' + ${tenant.id}" method="post">
            <input type="hidden" name="id" th:value="${tenant.id}">

            <div class="form-group">
                <label>Name <span style="color:red;">*</span></label>
                <input type="text" name="name" th:value="${tenant.name}" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" th:text="${tenant.description}"></textarea>
            </div>

            <div class="form-group">
                <label>Base Currency <span style="color:red;">*</span></label>
                <select name="baseCurrency" required>
                    <option value="">— Select —</option>
                    <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}" th:selected="${c == tenant.baseCurrency}"></option>
                </select>
                <div class="note">All reports and dashboards will convert amounts to this currency.</div>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" name="active" th:checked="${tenant.active}">
                <label>Active</label>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="/admin/tenants" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
