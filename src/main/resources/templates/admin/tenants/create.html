<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Tenant</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { display: inline; font-weight: normal; }
        .error { color: red; margin: 10px 0; }
        .field-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>🏢 Create Tenant</h1>
    <a href="/admin/tenants">← Back to Tenants</a>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/tenants}">
        <div class="field-group">
            <label for="name">Tenant Name:</label>
            <input type="text" id="name" name="name" placeholder="e.g., Acme Corp" required />
        </div>

        <div class="field-group">
            <label for="description">Description (optional):</label>
            <textarea id="description" name="description" rows="3" placeholder="Brief description of this tenant..."></textarea>
        </div>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="active" value="true" checked />
                Active
            </label>
        </div>

        <button type="submit">Create Tenant</button>
    </form>
</body>
</html>
