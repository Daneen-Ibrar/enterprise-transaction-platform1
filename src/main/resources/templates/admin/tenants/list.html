<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tenants</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-create { background: #2d7a3a; color: white; padding: 8px 16px; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🏢 Tenants</h1>
    <a href="/dashboard">← Back to Dashboard</a>
    <a href="/admin/tenants/create" class="btn btn-create" style="margin-left: 20px;">+ Create Tenant</a>

    <div th:if="${success}" class="flash-success" th:text="${success}"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tenants}">
                <td th:text="${t.id}">1</td>
                <td th:text="${t.name}">default</td>
                <td th:text="${t.description}">Default tenant</td>
                <td>
                    <span class="badge" th:classappend="${t.active ? 'badge-active' : 'badge-inactive'}"
                          th:text="${t.active ? 'Active' : 'Inactive'}">
                    </span>
                </td>
                <td>
                    <a th:href="@{/admin/tenants/{id}/edit(id=${t.id})}" class="btn btn-edit">✏️ Edit</a>
                    <form method="post" th:action="@{/admin/tenants/{id}/delete(id=${t.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-delete" onclick="return confirm('Delete this tenant?')">🗑️</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
