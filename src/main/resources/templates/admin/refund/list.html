<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Refund Transactions</title>
</head>
<body>
    <h1>Settled Transactions (Eligible for Refund)</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Merchant</th>
                <th>Amount</th>
                <th>Settled At</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.id}">1</td>
                <td th:text="${tx.customerId}">1</td>
                <td th:text="${tx.merchantId}">2</td>
                <td th:text="${tx.amount}">100.00</td>
                <td th:text="${tx.updatedAt}">2026-01-01</td>
                <td>
                    <a th:href="@{/admin/refunds/{id}(id=${tx.id})}">Refund</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
