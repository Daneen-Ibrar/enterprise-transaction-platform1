<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Transactions</title>
</head>
<body>
    <h1>All Transactions</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Invoice</th>
                <th>Customer</th>
                <th>Merchant</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactions.content}">
                <td th:text="${tx.id}">1</td>
                <td th:text="${tx.invoiceId}">100</td>
                <td th:text="${tx.customerId}">1</td>
                <td th:text="${tx.merchantId}">2</td>
                <td th:text="${tx.amount}">100.00</td>
                <td th:text="${tx.status}">SETTLED</td>
                <td th:text="${tx.createdAt}">2026-01-01</td>
            </tr>
        </tbody>
    </table>

    <div>
        <span>Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span></span>
    </div>
</body>
</html>
