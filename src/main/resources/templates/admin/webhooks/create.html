<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Webhook</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { display: inline; margin-right: 15px; }
        .flash-error { color: red; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>➕ Create Webhook</h1>
    <a href="/admin/webhooks">← Back to Webhooks</a>

    <div th:if="${error}" class="flash-error" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/webhooks}">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="https://example.com/webhook" required />

        <label for="eventType">Event Type:</label>
        <select id="eventType" name="eventType" required>
            <option th:each="type : ${eventTypes}" th:value="${type}" th:text="${type}"></option>
        </select>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="active" value="true" checked />
                Active
            </label>
        </div>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="retryEnabled" value="true" checked />
                Enable Retry
            </label>
        </div>

        <label for="retryMaxAttempts">Max Retry Attempts:</label>
        <input type="number" id="retryMaxAttempts" name="retryMaxAttempts" value="3" min="0" />

        <label for="timeoutMs">Timeout (ms):</label>
        <input type="number" id="timeoutMs" name="timeoutMs" value="5000" min="100" />

        <button type="submit">Create Webhook</button>
    </form>
</body>
</html>
