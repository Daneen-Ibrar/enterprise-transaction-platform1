<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reports Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .row { display: flex; flex-wrap: wrap; gap: 20px; }
        .col { flex: 1; min-width: 300px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin: 10px; background: #f9f9f9; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        h3 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>📊 Reports Dashboard</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <div class="row">
        <div class="col">
            <div class="card">
                <h3>Transaction Volume (Last 30 Days)</h3>
                <div class="chart-container">
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <h3>Average Transaction Amount</h3>
                <div class="chart-container">
                    <canvas id="avgChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="card">
                <h3>Payment Success Rate</h3>
                <div class="chart-container">
                    <canvas id="successChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <h3>Top Merchants by Volume</h3>
                <table border="1" cellpadding="8" style="width:100%;">
                    <thead><tr><th>Merchant ID</th><th>Total Amount</th></tr></thead>
                    <tbody>
                        <tr th:each="m : ${topMerchants}">
                            <td th:text="${m.merchantId}">1</td>
                            <td th:text="${m.totalAmount}">1000.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <div class="card">
                <h3>Export Data</h3>
                <a th:href="@{/admin/reports/data/transactions/csv}" class="btn">Download CSV</a>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            // Safely parse data from Thymeleaf
            const labels = /*[[${labels}]]*/ [];
            const volumeData = /*[[${volumeData}]]*/ [];
            const avgData = /*[[${avgData}]]*/ [];
            const successRate = /*[[${successRate}]]*/ { success: 0, failed: 0 };

            // Volume Chart (Bar)
            const ctx1 = document.getElementById('volumeChart').getContext('2d');
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Transaction Count',
                        data: volumeData,
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Average Amount Chart (Line)
            const ctx2 = document.getElementById('avgChart').getContext('2d');
            new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Average Amount (£)',
                        data: avgData,
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Success Rate (Donut)
            const ctx3 = document.getElementById('successChart').getContext('2d');
            new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: ['Successful', 'Failed'],
                    datasets: [{
                        data: [successRate.success || 0, successRate.failed || 0],
                        backgroundColor: ['#2d7a3a', '#c0392b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        });
        /*]]>*/
    </script>
</body>
</html>
