<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaction Details</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .field { margin: 10px 0; }
        .label { font-weight: bold; display: inline-block; width: 120px; }
        .badge { padding: 2px 8px; border-radius: 12px; color: white; }
        .badge-settled { background: #2d7a3a; }
        .badge-pending { background: #f39c12; }
        .badge-failed { background: #c0392b; }
        .badge-refunded { background: #8e44ad; }
        .back { margin-bottom: 20px; display: inline-block; }
        .btn { padding: 4px 10px; background: #8e44ad; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/transactions" class="back">← Back to Transactions</a>
        <h1>Transaction #<span th:text="${transaction.id}">1</span></h1>
        <div class="field"><span class="label">Invoice ID:</span> <span th:text="${transaction.invoiceId}">100</span></div>
        <div class="field"><span class="label">Customer ID:</span> <span th:text="${transaction.customerId}">1</span></div>
        <div class="field"><span class="label">Merchant ID:</span> <span th:text="${transaction.merchantId}">2</span></div>
        <div class="field"><span class="label">Amount:</span> <span th:text="${currencyHelper.getFormattedAmount(transaction.amount, transaction.currency)}">£ 100.00</span></div>
        <div class="field"><span class="label">Currency:</span> <span th:text="${transaction.currency}">GBP</span></div>
        <div class="field">
            <span class="label">Status:</span>
            <span class="badge" th:classappend="'badge-' + ${transaction.status.name().toLowerCase()}">
                [[${transaction.status}]]
            </span>
        </div>
        <div class="field"><span class="label">Created:</span> <span th:text="${transaction.createdAt}">2026-01-01</span></div>
        <div class="field"><span class="label">Updated:</span> <span th:text="${transaction.updatedAt}">2026-01-01</span></div>
        <div class="field">
            <a th:href="@{/transactions/{id}/timeline(id=${transaction.id})}" class="btn">⏳ View Timeline</a>
        </div>
    </div>
</body>
</html>
