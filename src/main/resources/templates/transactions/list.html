<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Transactions</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .badge { padding: 2px 8px; border-radius: 12px; color: white; }
        .badge-settled { background: #2d7a3a; }
        .badge-pending { background: #f39c12; }
        .badge-failed { background: #c0392b; }
        .badge-refunded { background: #8e44ad; }
        .btn { padding: 4px 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { opacity: 0.8; }
        .error { color: #c0392b; background: #f8d7da; padding: 10px; border-radius: 4px; }
        .info { background: #d4edda; padding: 10px; border-radius: 4px; color: #155724; }
    </style>
</head>
<body>
    <h1>My Transactions</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <!-- Show info/error messages -->
    <div th:if="${info}" class="info" th:text="${info}">Info</div>
    <div th:if="${error}" class="error" th:text="${error}">Error</div>

    <p th:if="${transactions.empty and !error and !info}">No transactions found.</p>

    <table th:unless="${transactions.empty}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Invoice</th>
                <th>Amount</th>
                <th>Currency</th>
                <th>Status</th>
                <th>Created</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.id}">1</td>
                <td th:text="${tx.invoiceId}">100</td>
                <td th:text="${currencyHelper.getFormattedAmount(tx.amount, tx.currency)}">£ 100.00</td>
                <td th:text="${tx.currency}">GBP</td>
                <td>
                    <span class="badge" th:classappend="'badge-' + ${tx.status.name().toLowerCase()}">
                        [[${tx.status}]]
                    </span>
                </td>
                <td th:text="${tx.createdAt}">2026-01-01</td>
                <td>
                    <a th:href="@{/transactions/{id}(id=${tx.id})}" class="btn">View</a>
                    <a th:href="@{/transactions/{id}/timeline(id=${tx.id})}" class="btn" style="background: #8e44ad;">Timeline</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
