<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Private Chat</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .chat-box { border: 1px solid #ccc; padding: 10px; max-height: 400px; overflow-y: auto; background: #f9f9f9; }
        .message { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; }
        .message .sender { font-weight: bold; }
        .message .time { font-size: 0.8em; color: #888; }
        .form-group { margin: 10px 0; }
        .form-group textarea { width: 100%; padding: 5px; }
        .btn { padding: 5px 15px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #1e5c2a; }
        .error { color: red; padding: 10px; border: 1px solid red; background: #ffeeee; }
    </style>
</head>
<body>
    <div th:if="${error != null}" class="error" th:text="${error}"></div>

    <h1>Private Chat – Invoice #<span th:text="${invoice.id}">1</span></h1>
    <p>Chat with: <strong th:text="${otherUser.email}">user@test.com</strong></p>
    <a href="/dashboard">← Back to Dashboard</a>

    <div class="chat-box">
        <div th:each="msg : ${messages}" class="message">
            <span class="sender" th:text="${msg.sender.email}">sender@test.com</span>
            <span class="time" th:text="${#temporals.format(msg.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</span>
            <p th:text="${msg.message}">Hello</p>
        </div>
        <div th:if="${messages.empty}">
            <p>No messages yet.</p>
        </div>
    </div>

    <form method="post" th:action="@{/private-chat/{id}/send(id=${invoice.id})}">
        <input type="hidden" name="recipientId" th:value="${otherUser.id}"/>
        <div class="form-group">
            <textarea name="message" rows="3" placeholder="Type your message..." required></textarea>
        </div>
        <button type="submit" class="btn">Send</button>
    </form>
</body>
</html>
