<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Recurring Schedule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin: 15px 0; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; max-width: 400px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2d7a3a; color: white; }
    </style>
</head>
<body>
    <h1>📆 New Recurring Schedule</h1>
    <a href="/merchant/recurring">← Back to List</a>

    <form method="post" th:action="@{/merchant/recurring}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label>Customer Email</label>
            <input type="email" name="customerEmail" required />
        </div>
        <div class="form-group">
            <label>Amount</label>
            <input type="number" step="0.01" name="amount" required />
        </div>
        <div class="form-group">
            <label>Currency</label>
            <select name="currency">
                <option value="GBP">GBP (£)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" required />
        </div>
        <div class="form-group">
            <label>Frequency</label>
            <select name="frequency" required>
                <option value="DAILY">Daily</option>
                <option value="WEEKLY" selected>Weekly</option>
                <option value="MONTHLY">Monthly</option>
            </select>
        </div>
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" name="startDate" required />
        </div>
        <div class="form-group">
            <label>End Date (optional)</label>
            <input type="date" name="endDate" />
        </div>

        <button type="submit" class="btn btn-primary">Create Schedule</button>
    </form>
</body>
</html>
