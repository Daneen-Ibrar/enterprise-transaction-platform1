<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Recurring Schedule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin: 15px 0; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; max-width: 400px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2d7a3a; color: white; }
    </style>
</head>
<body>
    <h1>📝 Edit Recurring Schedule</h1>
    <a href="/merchant/recurring">← Back to List</a>

    <form method="post" th:action="@{/merchant/recurring/{id}(id=${schedule.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label>Customer Email</label>
            <input type="email" name="customerEmail" th:value="${schedule.customerEmail}" required />
        </div>
        <div class="form-group">
            <label>Amount</label>
            <input type="number" step="0.01" name="amount" th:value="${schedule.amount}" required />
        </div>
        <div class="form-group">
            <label>Currency</label>
            <select name="currency">
                <option value="GBP" th:selected="${schedule.currency == 'GBP'}">GBP (£)</option>
                <option value="USD" th:selected="${schedule.currency == 'USD'}">USD ($)</option>
                <option value="EUR" th:selected="${schedule.currency == 'EUR'}">EUR (€)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" th:value="${schedule.description}" required />
        </div>
        <div class="form-group">
            <label>Frequency</label>
            <select name="frequency" required>
                <option value="DAILY" th:selected="${schedule.frequency.name() == 'DAILY'}">Daily</option>
                <option value="WEEKLY" th:selected="${schedule.frequency.name() == 'WEEKLY'}">Weekly</option>
                <option value="MONTHLY" th:selected="${schedule.frequency.name() == 'MONTHLY'}">Monthly</option>
            </select>
        </div>
        <div class="form-group">
            <label>Start Date</label>
            <input type="date" name="startDate" th:value="${schedule.startDate}" required />
        </div>
        <div class="form-group">
            <label>End Date (optional)</label>
            <input type="date" name="endDate" th:value="${schedule.endDate}" />
        </div>

        <button type="submit" class="btn btn-primary">Update Schedule</button>
    </form>
</body>
</html>
