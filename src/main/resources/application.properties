spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_platform
spring.datasource.username=platform_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
server.port=8080
management.endpoints.web.exposure.include=health
logging.pattern.console=%clr(%d{ISO8601}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%X{correlationId}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n
server.forward-headers-strategy=native
server.tomcat.redirect-context-root=false
server.error.forward-headers-strategy=native