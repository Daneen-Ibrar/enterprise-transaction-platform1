<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Invoice</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input, textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        textarea { height: 100px; }  /* makes it larger */
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
    </style>
</head>
<body>
    <h1>📄 Create Invoice</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <form method="post" th:action="@{/invoices/create}">
        <!-- Amount -->
        <label for="amount">Amount (£):</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required />

        <!-- Description – now a textarea -->
        <label for="description">Description:</label>
        <textarea id="description" name="description" rows="4" placeholder="Enter invoice description..." required></textarea>

        <!-- Customer Email -->
        <label for="customerEmail">Customer Email:</label>
        <input type="email" id="customerEmail" name="customerEmail" required />

        <button type="submit">Create Invoice</button>
    </form>
</body>
</html>
