<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>User Management</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        .filters { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
        .filters input, .filters select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .filters button { padding: 6px 15px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .filters button:hover { background: #1e5c2a; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 0.85em; }
        .btn-edit { background: #3498db; color: white; }
        .btn-impersonate { background: #f39c12; color: white; }
        .btn-edit:hover, .btn-impersonate:hover { opacity: 0.8; }
        .btn-revoke { background: #c0392b; color: white; }
        .btn-revoke:hover { background: #a93226; }
        .badge { padding: 2px 8px; border-radius: 12px; color: white; }
        .badge-active { background: #2d7a3a; }
        .badge-inactive { background: #c0392b; }
        .pagination { margin-top: 20px; }
        .pagination a { margin-right: 8px; }
        .create-link { display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>👥 User Management</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <div style="margin: 15px 0;">
        <a href="/admin/users/create" class="btn" style="background:#2d7a3a; color:white; padding:8px 16px;">+ Create New User</a>
    </div>

    <!-- Filters -->
    <div class="filters">
        <form method="get" th:action="@{/admin/users}">
            <label>Search: <input type="text" name="search" th:value="${search}" placeholder="Email" /></label>
            <label>Role:
                <select name="role">
                    <option value="">All</option>
                    <option th:each="role : ${allRoles}" th:value="${role.name}" th:text="${role.name}" th:selected="${role.name == selectedRole}"></option>
                </select>
            </label>
            <button type="submit">Apply</button>
            <a th:href="@{/admin/users}" style="margin-left:10px;">Reset</a>
        </form>
    </div>

    <!-- Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Roles</th>
                <th>Tenant</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.email}">user@example.com</td>
                <td>
                    <span th:each="role : ${user.roles}" th:text="${role.name}" style="display:inline-block; background:#e0e0e0; padding:2px 8px; border-radius:4px; margin:2px;"></span>
                </td>
                <td th:text="${user.tenantName}">Tenant A</td>
                <td>
                    <span class="badge" th:classappend="${user.active ? 'badge-active' : 'badge-inactive'}" th:text="${user.active ? '✅ Active' : '❌ Inactive'}">Active</span>
                </td>
                <td th:text="${user.createdAt}">2026-01-01</td>
                <td>
                    <!-- Edit -->
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-edit">Edit</a>
                    <!-- Impersonate (only for ADMINs and if user is active) -->
                    <form method="post" th:action="@{/admin/users/{id}/impersonate(id=${user.id})}" style="display:inline;" th:if="${user.active}">
                        <button type="submit" class="btn btn-impersonate">Impersonate</button>
                    </form>
                    <!-- Revoke (only if active) -->
                    <form method="post" th:action="@{/admin/users/revoke/{id}(id=${user.id})}" style="display:inline;" th:if="${user.active}">
                        <button type="submit" class="btn btn-revoke" onclick="return confirm('Revoke this user?')">Revoke</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination (if needed) -->
    <div th:if="${users} and ${users.size() > 0}" class="pagination">
        <!-- Add pagination controls if you implement pagination -->
    </div>

    <div th:if="${users.empty}" style="text-align:center; color:#888; padding:30px;">
        No users found.
    </div>
</div>
</body>
</html>
