<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reconciliation Reports</title>
</head>
<body>
    <h1>Reconciliation Reports</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Started</th>
                <th>Completed</th>
                <th>Status</th>
                <th>Total</th>
                <th>Matched</th>
                <th>Mismatched</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.id}">1</td>
                <td th:text="${record.startedAt}">2026-01-01</td>
                <td th:text="${record.completedAt}">2026-01-01</td>
                <td th:text="${record.status}">PASS</td>
                <td th:text="${record.totalTransactions}">10</td>
                <td th:text="${record.matchedTransactions}">10</td>
                <td th:text="${record.mismatchedTransactions}">0</td>
                <td th:text="${record.details}">Summary</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
