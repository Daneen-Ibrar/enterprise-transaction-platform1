<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>API Keys</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        .tabs { margin: 20px 0; }
        .tab-btn { padding: 8px 16px; border: 1px solid #ccc; background: #f9f9f9; cursor: pointer; border-radius: 4px 4px 0 0; margin-right: 4px; }
        .tab-btn.active { background: #2d7a3a; color: white; border-color: #2d7a3a; }
        .tab-btn:hover { background: #e0e0e0; }
        .tab-btn.active:hover { background: #1e5c2a; }
        .form-group { margin: 15px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .form-group input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-success { background: #2d7a3a; color: white; }
        .btn-success:hover { background: #1e5c2a; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .btn-secondary { background: #3498db; color: white; }
        .btn-secondary:hover { background: #2980b9; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; color: white; }
        .badge-active { background: #2d7a3a; }
        .badge-revoked { background: #c0392b; }
        .search-section { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-section input[type="text"] { flex: 1; min-width: 200px; }
        #keyTableBody tr:hover { background: #f5f5f5; }
        .empty-message { text-align: center; color: #888; padding: 30px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔑 API Keys</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <!-- Generate new key -->
    <div class="form-group">
        <form id="generateForm" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="keyName" placeholder="Key name (e.g., My App)" required/>
            <button type="submit" class="btn btn-success">Generate New Key</button>
        </form>
    </div>

    <!-- Tabs and Search -->
    <div class="tabs">
        <button class="tab-btn active" data-filter="active">Active</button>
        <button class="tab-btn" data-filter="revoked">Revoked</button>
        <button class="tab-btn" data-filter="all">All</button>
    </div>
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="Search by key, name, or user email..."/>
        <button id="searchBtn" class="btn btn-secondary">🔍 Search</button>
        <button id="clearSearchBtn" class="btn btn-secondary">Clear</button>
    </div>

    <!-- Key table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Key</th>
                <th>Name</th>
                <th>User</th>
                <th>Status</th>
                <th>Last Used</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="keyTableBody">
            <!-- Rows rendered by JavaScript -->
        </tbody>
    </table>
    <div id="emptyMessage" class="empty-message" style="display:none;">No keys found matching your criteria.</div>
</div>

<script>
    (function() {
        // State
        let currentFilter = 'active'; // 'active', 'revoked', 'all'
        let currentSearch = '';

        // DOM refs
        const tbody = document.getElementById('keyTableBody');
        const emptyMsg = document.getElementById('emptyMessage');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const generateForm = document.getElementById('generateForm');

        // Fetch and render keys
        function fetchKeys() {
            let url = '/admin/api-keys/list?';
            const params = [];
            if (currentFilter === 'active') params.push('active=true');
            else if (currentFilter === 'revoked') params.push('active=false');
            // For 'all', we don't send active param
            if (currentSearch.trim()) {
                params.push('search=' + encodeURIComponent(currentSearch.trim()));
            }
            url += params.join('&');

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    renderTable(data);
                })
                .catch(err => {
                    console.error('Error fetching keys:', err);
                    tbody.innerHTML = '<tr><td colspan="8">Error loading keys.</td></tr>';
                    emptyMsg.style.display = 'none';
                });
        }

        function renderTable(keys) {
            tbody.innerHTML = '';
            if (!keys || keys.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';
            keys.forEach(key => {
                const row = document.createElement('tr');
                const statusClass = key.active ? 'badge-active' : 'badge-revoked';
                const statusText = key.active ? '✅ Active' : '❌ Revoked';
                row.innerHTML = `
                    <td>${key.id}</td>
                    <td><code>${key.keyValue}</code></td>
                    <td>${key.name}</td>
                    <td>${key.userEmail}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>${key.lastUsedAt ? new Date(key.lastUsedAt).toLocaleString() : '-'}</td>
                    <td>${new Date(key.createdAt).toLocaleString()}</td>
                    <td>
                        ${key.active ? `<button class="btn btn-danger revoke-btn" data-id="${key.id}">Revoke</button>` : '-'}
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Attach revoke event listeners
            document.querySelectorAll('.revoke-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (confirm('Are you sure you want to revoke this API key?')) {
                        fetch(`/admin/api-keys/${id}/revoke`, { method: 'POST' })
                            .then(response => response.text())
                            .then(msg => {
                                alert(msg);
                                fetchKeys(); // refresh
                            })
                            .catch(err => {
                                alert('Error revoking key: ' + err.message);
                            });
                    }
                });
            });
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                fetchKeys();
            });
        });

        // Search
        function doSearch() {
            currentSearch = searchInput.value;
            fetchKeys();
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                doSearch();
            }
        });
        clearSearchBtn.addEventListener('click', function() {
            searchInput.value = '';
            currentSearch = '';
            fetchKeys();
        });

        // Generate new key
        generateForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('keyName').value.trim();
            if (!name) {
                alert('Please enter a name for the key.');
                return;
            }
            fetch('/admin/api-keys/generate?name=' + encodeURIComponent(name), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('keyName').value = '';
                fetchKeys(); // refresh
            })
            .catch(err => {
                alert('Error generating key: ' + err.message);
            });
        });

        // Initial load
        fetchKeys();
    })();
</script>
</body>
</html>
