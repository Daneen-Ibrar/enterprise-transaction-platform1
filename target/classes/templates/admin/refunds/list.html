<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Settled Transactions – Refund</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-success { background: #2d7a3a; color: white; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-primary { background: #3498db; color: white; }
        .btn:hover { opacity: 0.8; }
        .btn-disabled { background: #999; color: #ccc; cursor: not-allowed; }
        .flash-error { color: red; padding: 10px; border: 1px solid red; background: #ffeeee; margin: 10px 0; }
        .flash-success { color: green; padding: 10px; border: 1px solid green; background: #eeffee; margin: 10px 0; }
        .bulk-bar { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 4px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .bulk-bar input, .bulk-bar button { padding: 6px 12px; }
    </style>
</head>
<body>
    <h1>Settled Transactions (Eligible for Refund)</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <div th:if="${param.success}" class="flash-success" th:text="${param.success}">Success</div>
    <div th:if="${error}" class="flash-error" th:text="${error}">Error</div>

    <!-- ===== BULK REFUND BAR ===== -->
    <form method="post" id="bulkRefundForm" th:action="@{/admin/refunds/bulk}">
        <div class="bulk-bar">
            <span><strong>Bulk Refund:</strong></span>
            <label>Reason: <input type="text" name="reason" required placeholder="Enter reason for refund..."/></label>
            <button type="submit" class="btn btn-danger" onclick="return confirmBulkRefund()">Refund Selected</button>
            <span style="font-size: 0.9em; color: #888;">(Select refundable transactions below)</span>
        </div>

        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAllRefund" onclick="toggleAllRefund()"/></th>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Merchant</th>
                    <th>Amount</th>
                    <th>Settled At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}">
                    <td>
                        <input type="checkbox" name="ids" th:value="${tx.id}" th:if="${refundableMap[tx.id]}"/>
                        <span th:unless="${refundableMap[tx.id]}" style="color:#ccc;">—</span>
                    </td>
                    <td th:text="${tx.id}">1</td>
                    <td th:text="${tx.customerId}">1</td>
                    <td th:text="${tx.merchantId}">2</td>
                    <td th:text="${tx.amount}">100.00</td>
                    <td th:text="${tx.updatedAt}">2026-01-01</td>
                    <td>
                        <div th:if="${refundableMap[tx.id]}">
                            <a th:href="@{/admin/refunds/{id}(id=${tx.id})}" class="btn btn-success">Refund</a>
                        </div>
                        <div th:unless="${refundableMap[tx.id]}">
                            <span style="color: red; font-weight: bold;">Cannot Refund</span>
                        </div>
                    </td>
                </tr>
                <tr th:if="${transactions.empty}">
                    <td colspan="7">No settled transactions found.</td>
                </tr>
            </tbody>
        </table>
    </form>

    <script>
        function toggleAllRefund() {
            var checkboxes = document.getElementsByName('ids');
            var selectAll = document.getElementById('selectAllRefund');
            for (var cb of checkboxes) {
                cb.checked = selectAll.checked;
            }
        }

        function confirmBulkRefund() {
            var checked = document.querySelectorAll('input[name="ids"]:checked');
            if (checked.length === 0) {
                alert('Please select at least one transaction.');
                return false;
            }
            var reason = document.querySelector('input[name="reason"]').value;
            if (!reason.trim()) {
                alert('Please enter a reason for refund.');
                return false;
            }
            return confirm('Are you sure you want to refund ' + checked.length + ' transaction(s)?');
        }
    </script>
</body>
</html>
