<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dead Letter Queue</title>
</head>
<body>
    <h1>Dead Letter Queue</h1>
    <a href="/dashboard">← Back to Dashboard</a>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Operation</th>
                <th>Payload</th>
                <th>Failure Reason</th>
                <th>Count</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${entries.content}">
                <td th:text="${entry.id}">1</td>
                <td th:text="${entry.operationType}">PAYMENT</td>
                <td th:text="${entry.payload}">{...}</td>
                <td th:text="${entry.failureReason}">Timeout</td>
                <td th:text="${entry.failureCount}">3</td>
                <td th:text="${entry.status}">PENDING</td>
                <td th:text="${entry.createdAt}">2026-01-01</td>
            </tr>
        </tbody>
    </table>
    <div>
        Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${totalPages}">1</span>
    </div>
</body>
</html>
