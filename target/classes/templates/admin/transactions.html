<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Transactions</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .pagination { margin-top: 20px; }
        .pagination a { margin-right: 8px; }
    </style>
</head>
<body>
    <h1>All Transactions</h1>
<a href="/dashboard">← Back to Dashboard</a>

    <div class="pagination">
        <span th:if="${transactions.hasPrevious()}">
            <a th:href="@{/admin/transactions(page=${transactions.number - 1})}">Previous</a>
        </span>
        <span>Page [[${transactions.number + 1}]] of [[${transactions.totalPages}]]</span>
        <span th:if="${transactions.hasNext()}">
            <a th:href="@{/admin/transactions(page=${transactions.number + 1})}">Next</a>
        </span>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Invoice</th>
                <th>Customer</th>
                <th>Merchant</th>
                <th>Amount</th>
                <th>Currency</th>
                <th>Status</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactions.content}">
                <td><a th:href="@{/transactions/{id}(id=${tx.id})}" th:text="${tx.id}">1</a></td>
                <td th:text="${tx.invoiceId}">100</td>
                <td th:text="${tx.customerId}">1</td>
                <td th:text="${tx.merchantId}">2</td>
                <td th:text="${tx.amount}">100.00</td>
                <td th:text="${tx.currency}">GBP</td>
                <td th:text="${tx.status}">SETTLED</td>
                <td th:text="${tx.createdAt}">2026-01-01</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
