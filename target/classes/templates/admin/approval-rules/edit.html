<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Approval Rule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input, select, textarea { width: 100%; max-width: 500px; padding: 8px; box-sizing: border-box; }
        textarea { height: 60px; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { display: inline; }
    </style>
</head>
<body>
    <h1>✏️ Edit Approval Rule #<span th:text="${rule.id}">1</span></h1>
    <a href="/admin/approval-rules">← Back to Rules</a>

    <form method="post" th:action="@{/admin/approval-rules/{id}(id=${rule.id})}">
        <label for="priority">Priority (lower = higher priority):</label>
        <input type="number" id="priority" name="priority" th:value="${rule.priority}" min="0" required />

        <label for="conditionExpression">Condition Expression (SpEL):</label>
        <textarea id="conditionExpression" name="conditionExpression" required th:text="${rule.conditionExpression}"></textarea>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="requiresApproval" value="true" th:checked="${rule.requiresApproval}" />
                Requires Approval
            </label>
        </div>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" th:value="${rule.description}" />

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="active" value="true" th:checked="${rule.active}" />
                Active
            </label>
        </div>

        <button type="submit">Update Rule</button>
    </form>
</body>
</html>
