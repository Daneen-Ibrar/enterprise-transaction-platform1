<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audit Diff</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .diff-added { background: #d4edda; }
        .diff-removed { background: #f8d7da; }
        .diff-changed { background: #fff3cd; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .message { padding: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Audit Diff</h1>
    <a href="/admin/audit">← Back to Audit List</a>

    <div th:if="${message}" class="message" th:text="${message}">No diff available</div>

    <div th:unless="${message}">
        <p><strong>Event:</strong> <span th:text="${event.eventType}">TYPE</span></p>
        <p><strong>Entity:</strong> <span th:text="${event.entityType}">Entity</span> #<span th:text="${event.entityId}">ID</span></p>
        <p><strong>Timestamp:</strong> <span th:text="${event.createdAt}">time</span></p>

        <table>
            <thead>
                <tr><th>Field</th><th>Old Value</th><th>New Value</th></tr>
            </thead>
            <tbody>
                <tr th:each="diff : ${diffs}" th:classappend="${diff.type == 'added' ? 'diff-added' : diff.type == 'removed' ? 'diff-removed' : 'diff-changed'}">
                    <td th:text="${diff.field}">field</td>
                    <td th:text="${diff.oldValue}">old</td>
                    <td th:text="${diff.newValue}">new</td>
                </tr>
                <tr th:if="${diffs.empty}">
                    <td colspan="3">No changes detected.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
