<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Rejected Invoices</title>
</head>
<body>
    <h1>Rejected Invoices</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <form method="get" th:action="@{/admin/invoices/rejected}">
        <input type="text" name="search" placeholder="Search by customer email" th:value="${search}"/>
        <button type="submit">Search</button>
        <a th:href="@{/admin/invoices/rejected}">Clear</a>
    </form>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Customer</th>
                <th>Merchant</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inv : ${invoices}" style="background-color: #fdd;">
                <td th:text="${inv.id}">1</td>
                <td th:text="${currencyHelper.getFormattedAmount(inv.amount, inv.currency)}">£ 100.00</td>
                <td th:text="${inv.description}">Test</td>
                <td th:text="${inv.customerEmail}">customer@test.com</td>
                <td th:text="${inv.merchantId}">2</td>
                <td style="color:red; font-weight:bold;" th:text="${inv.status}">REJECTED</td>
                <td>
                    <form method="post" th:action="@{/admin/invoices/{id}/reapprove(id=${inv.id})}" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" style="background:green; color:white;">Re-approve</button>
                    </form>
                    <a th:href="@{/admin/invoices/{id}/messages(id=${inv.id})}">💬 Chat</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
