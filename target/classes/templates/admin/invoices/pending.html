<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pending Approvals</title>
</head>
<body>
    <h1>Pending Invoices for Approval</h1>
    <a href="/dashboard">← Back to Dashboard</a>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Customer</th>
                <th>Merchant</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inv : ${invoices}">
                <td th:text="${inv.id}">1</td>
                <td th:text="${inv.amount}">100.00</td>
                <td th:text="${inv.description}">Test</td>
                <td th:text="${inv.customerEmail}">customer@test.com</td>
                <td th:text="${inv.merchantId}">2</td>
                <td>
                    <form method="post" th:action="@{/admin/invoices/{id}/approve(id=${inv.id})}" style="display:inline;">
                        <button type="submit">Approve</button>
                    </form>
                    <form method="post" th:action="@{/admin/invoices/{id}/reject(id=${inv.id})}" style="display:inline;">
                        <button type="submit">Reject</button>
                    </form>
                </td>
                <td>
    <a th:href="@{/admin/invoices/{id}/messages(id=${inv.id})}">💬 Chat</a>
</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
