<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tenants</title>
    <style>
        /* (same styles as before) */
    </style>
</head>
<body>
    <div class="container">
        <h1>Tenants</h1>
        <div th:if="${success}" class="success-msg" th:text="${success}"></div>
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <div class="header-actions">
            <a href="/admin/tenants/create" class="btn btn-primary">➕ Create New</a>
            <a href="/dashboard" class="btn btn-secondary">← Dashboard</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Base Currency</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tenant : ${tenants}">
                    <td th:text="${tenant.id}">1</td>
                    <td th:text="${tenant.name}">Default</td>
                    <td th:text="${tenant.description}">-</td>
                    <td th:text="${tenant.baseCurrency}">GBP</td>
                    <td><span class="badge" th:class="${tenant.active} ? 'badge-success' : 'badge-danger'" th:text="${tenant.active} ? 'Active' : 'Inactive'">Active</span></td>
                    <td class="actions">
                        <a th:href="'/admin/tenants/' + ${tenant.id} + '/edit'" class="btn btn-primary btn-sm">Edit</a>
                        <form th:action="'/admin/tenants/' + ${tenant.id} + '/delete'" method="post" onsubmit="return confirm('Delete this tenant?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${tenants.empty}">
                    <td colspan="6" class="empty">No tenants found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
