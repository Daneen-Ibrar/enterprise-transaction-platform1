<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit User</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; }
        input, select { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { max-width: 400px; }
        .checkbox-group label { display: inline-block; margin-right: 15px; }
        .status-box { margin: 15px 0; }
        .status-box label { display: inline; }
        .tenant-display { padding: 8px; background: #f0f0f0; border-radius: 4px; display: inline-block; }
        .flash-success { background: #d4edda; color: #155724; padding: 10px; border: 1px solid #c3e6cb; margin: 10px 0; }
        .flash-error { background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>✏️ Edit User: <span th:text="${user.email}">user@test.com</span></h1>
    <a href="/admin/users">← Back to User List</a>

    <div th:if="${success}" class="flash-success" th:text="${success}"></div>
    <div th:if="${error}" class="flash-error" th:text="${error}"></div>

    <form method="post" th:action="@{/admin/users/{id}(id=${user.id})}">
        <label>Roles:</label>
        <div class="checkbox-group">
            <div th:each="role : ${allRoles}">
                <input type="checkbox" th:id="'role_' + ${role.id}" th:name="roleIds" th:value="${role.id}"
                       th:checked="${userRoleIds.contains(role.id)}" />
                <label th:for="'role_' + ${role.id}" th:text="${role.name}">ROLE</label>
            </div>
        </div>

        <!-- Tenant is read‑only – display only -->
        <label>Tenant:</label>
        <div class="tenant-display" th:text="${currentTenant != null ? currentTenant.name : 'Default'}">Default</div>

        <div class="status-box">
            <label>
                <input type="checkbox" name="active" value="true" th:checked="${user.active}" />
                Active
            </label>
            <p style="font-size: 0.8em; color: #888;">Uncheck to deactivate this user account.</p>
        </div>

        <button type="submit">Update User</button>
    </form>
</body>
</html>
