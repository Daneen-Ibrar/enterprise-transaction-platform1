<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Webhooks</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-create { background: #2d7a3a; color: white; padding: 8px 16px; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-toggle { background: #e67e22; color: white; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .flash-success { background: #d4edda; color: #155724; padding: 10px; border: 1px solid #c3e6cb; margin: 10px 0; }
        .flash-error { background: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; margin: 10px 0; }
        .banner-disabled {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin: 10px 0;
        }
        .banner-disabled a {
            color: #721c24;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🌐 Webhooks</h1>
    <a href="/dashboard">← Back to Dashboard</a>
    <a href="/admin/webhooks/create" class="btn btn-create" style="margin-left: 20px;">+ Create Webhook</a>

    <!-- ===== DISABLED BANNER ===== -->
    <div th:if="${!webhooksEnabled}" class="banner-disabled">
        ⚠️ Webhook delivery is currently <strong>disabled</strong>. Enable it from
        <a href="/admin/features">Feature Toggles</a> to send webhook events.
    </div>

    <div th:if="${success}" class="flash-success" th:text="${success}"></div>
    <div th:if="${error}" class="flash-error" th:text="${error}"></div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>URL</th>
                <th>Event</th>
                <th>Status</th>
                <th>Retry</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="w : ${webhooks}">
                <td th:text="${w.name}">Webhook 1</td>
                <td th:text="${w.url}">https://example.com</td>
                <td th:text="${w.eventType}">TRANSACTION_SETTLED</td>
                <td>
                    <span class="badge" th:classappend="${w.active ? 'badge-active' : 'badge-inactive'}"
                          th:text="${w.active ? 'Active' : 'Inactive'}">
                    </span>
                </td>
                <td th:text="${w.retryEnabled ? 'Yes' : 'No'}">Yes</td>
                <td class="actions">
                    <a th:href="@{/admin/webhooks/{id}/edit(id=${w.id})}" class="btn btn-edit">✏️ Edit</a>
                    <form method="post" th:action="@{/admin/webhooks/{id}/toggle(id=${w.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-toggle"
                                onclick="return confirm('Toggle this webhook?')"
                                th:text="${w.active ? 'Deactivate' : 'Activate'}">
                        </button>
                    </form>
                    <form method="post" th:action="@{/admin/webhooks/{id}/delete(id=${w.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-delete"
                                onclick="return confirm('Delete this webhook?')">
                            🗑️
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${webhooks.empty}">
                <td colspan="6">No webhooks configured.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
