<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Refund Rule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { display: inline; margin-right: 15px; }
    </style>
</head>
<body>
    <h1>➕ Create Refund Rule</h1>
    <a href="/admin/refund-rules">← Back to Rules</a>

    <form method="post" th:action="@{/admin/refund-rules}">
        <label for="rulePriority">Priority (lower = higher priority):</label>
        <input type="number" id="rulePriority" name="rulePriority" value="10" min="0" required />

        <label for="conditionExpression">Condition (SpEL):</label>
        <input type="text" id="conditionExpression" name="conditionExpression" placeholder="e.g., amount < 1000" required />

        <label for="action">Action:</label>
        <select id="action" name="action" required>
            <option value="ALLOW">ALLOW</option>
            <option value="REQUIRE_APPROVAL">REQUIRE_APPROVAL</option>
            <option value="DENY">DENY</option>
        </select>

        <label for="requiredPermission">Required Permission (if action = REQUIRE_APPROVAL):</label>
        <input type="text" id="requiredPermission" name="requiredPermission" placeholder="e.g., refund:approve" />

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="active" value="true" checked />
                Active
            </label>
        </div>

        <button type="submit">Create Rule</button>
    </form>
</body>
</html>
