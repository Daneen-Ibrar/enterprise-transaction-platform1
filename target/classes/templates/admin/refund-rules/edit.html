<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Refund Rule</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 20px; background: #2d7a3a; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1e5c2a; }
        .checkbox-group { margin: 10px 0; }
        .checkbox-group label { display: inline; margin-right: 15px; }
    </style>
</head>
<body>
    <h1>✏️ Edit Refund Rule</h1>
    <a href="/admin/refund-rules">← Back to Rules</a>

    <form method="post" th:action="@{/admin/refund-rules/{id}(id=${rule.id})}">
        <label for="rulePriority">Priority (lower = higher priority):</label>
        <input type="number" id="rulePriority" name="rulePriority" th:value="${rule.rulePriority}" min="0" required />

        <label for="conditionExpression">Condition (SpEL):</label>
        <input type="text" id="conditionExpression" name="conditionExpression" th:value="${rule.conditionExpression}" required />

        <label for="action">Action:</label>
        <select id="action" name="action" required>
            <option value="ALLOW" th:selected="${rule.action == 'ALLOW'}">ALLOW</option>
            <option value="REQUIRE_APPROVAL" th:selected="${rule.action == 'REQUIRE_APPROVAL'}">REQUIRE_APPROVAL</option>
            <option value="DENY" th:selected="${rule.action == 'DENY'}">DENY</option>
        </select>

        <label for="requiredPermission">Required Permission:</label>
        <input type="text" id="requiredPermission" name="requiredPermission" th:value="${rule.requiredPermission}" />

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="active" value="true" th:checked="${rule.active}" />
                Active
            </label>
        </div>

        <button type="submit">Update Rule</button>
    </form>
</body>
</html>
