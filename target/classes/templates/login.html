<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        .error-box { color: red; padding: 10px; border: 1px solid red; background: #ffeeee; margin: 10px 0; }
        .success-box { color: green; padding: 10px; border: 1px solid green; background: #eeffee; margin: 10px 0; }
        label { display: block; margin: 5px 0; }
        input { padding: 5px; width: 200px; }
        button { padding: 5px 15px; }
    </style>
</head>
<body>
    <h1>Login</h1>

    <!-- Show custom error message if present -->
    <div th:if="${param.error != null}" class="error-box">
        <p th:text="${session.SPRING_SECURITY_LAST_EXCEPTION != null ? session.SPRING_SECURITY_LAST_EXCEPTION.message : 'Invalid credentials'}">
            Invalid credentials
        </p>
    </div>

    <!-- Show disabled message if redirected from filter -->
    <div th:if="${param.error == 'disabled'}" class="error-box">
        <p>Your account has been disabled by an administrator.</p>
    </div>

    <!-- Show logout message if present -->
    <div th:if="${param.logout != null}" class="success-box">
        <p>You have been logged out.</p>
    </div>

    <form method="post" th:action="@{/login}">
        <label>Email: <input type="text" name="username" required/></label>
        <label>Password: <input type="password" name="password" required/></label>
        <button type="submit">Login</button>
    </form>
</body>
</html>
