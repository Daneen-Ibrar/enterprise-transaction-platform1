<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Pay Invoice</title></head>
<body>
    <h1>Pay Invoice #<span th:text="${invoice.id}">1</span></h1>
    <p>Amount: <span th:text="${invoice.amount}">100.00</span></p>
    <p>Description: <span th:text="${invoice.description}">desc</span></p>
    <hr/>
    <h3>Card Details (Demo)</h3>
    <form method="post" th:action="@{/api/payments}">
        <!-- Hidden fields -->
        <input type="hidden" name="invoiceId" th:value="${invoice.id}"/>
        <input type="hidden" name="customerId" th:value="1"/> <!-- placeholder -->
        <input type="hidden" name="merchantId" th:value="${invoice.merchantId}"/>
        <input type="hidden" name="amount" th:value="${invoice.amount}"/>
        <label>Card Number: <input type="text" value="4111 1111 1111 1111" disabled/></label><br/>
        <label>Expiry: <input type="text" value="12/25" disabled/></label><br/>
        <label>CVV: <input type="text" value="123" disabled/></label><br/>
        <button type="submit">Pay Now</button>
    </form>
    <a href="/dashboard">Cancel</a>
</body>
</html>
